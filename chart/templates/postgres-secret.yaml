{{- /*
DB credentials Secret. Two modes:
  - keycloak.db.credentialsSecret.create=true  → chart renders this Secret from inline
    keycloak.db.username + keycloak.db.credentialsSecret.password (password required).
  - keycloak.db.credentialsSecret.create=false → chart skips rendering; the named Secret
    must be provisioned externally (e.g. ExternalSecret in extraResources) with the
    `usernameKey` and `passwordKey` keys.
*/ -}}
{{- if .Values.keycloak.db.credentialsSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.db.credentialsSecret.name }}
  labels:
    {{- include "keycloak-operator.postgresLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.keycloak.db.credentialsSecret.usernameKey }}: {{ .Values.keycloak.db.username | quote }}
  {{ .Values.keycloak.db.credentialsSecret.passwordKey }}: {{ required "keycloak.db.credentialsSecret.password required when credentialsSecret.create=true" .Values.keycloak.db.credentialsSecret.password | quote }}
{{- end }}
