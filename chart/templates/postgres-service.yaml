{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "keycloak-operator.postgresLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "keycloak-operator.postgresSelectorLabels" . | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
