apiVersion: v1
kind: Service
metadata:
  name: keycloak-operator
  labels:
    {{- include "keycloak-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    {{- include "keycloak-operator.selectorLabels" . | nindent 4 }}
