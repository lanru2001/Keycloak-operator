{{- /*
Inline bootstrap admin Secret — rendered only when bootstrapAdmin.password is
set. Name resolves through keycloak-operator.bootstrapAdminSecretName, which
either uses bootstrapAdmin.secretName (if customer pinned a name) or falls
back to "<release>-bootstrap-admin". Same name is referenced by keycloak.yaml
and the config-cli Job, so external-secret customers can drop in their own
provisioning under that name without changing anything else.
*/ -}}
{{- if .Values.keycloak.bootstrapAdmin.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak-operator.bootstrapAdminSecretName" . }}
  labels:
    {{- include "keycloak-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "keycloak.bootstrapAdmin.username required when password is set inline" .Values.keycloak.bootstrapAdmin.username | quote }}
  password: {{ .Values.keycloak.bootstrapAdmin.password | quote }}
{{- end }}
